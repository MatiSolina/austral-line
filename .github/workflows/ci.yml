name: CI
on:
  pull_request:
  push:
    branches: [main]

# ponytail: sin deploy automático de migraciones. Un token de Supabase en los secrets
# lo podría leer cualquier alumno con acceso de escritura. Después de mergear: npx supabase db push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Aplicar todas las migraciones desde cero
        run: npx supabase db start
      - name: Los tipos commiteados coinciden con las migraciones
        run: |
          npx supabase gen types typescript --local > src/lib/database.types.ts
          git diff --exit-code src/lib/database.types.ts || (echo "::error::Corré npm run db:types y commiteá el resultado" && exit 1)
      - name: Ninguna migración nueva borra ni renombra cosas
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth 1
          files=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }} -- supabase/migrations)
          [ -z "$files" ] || ! grep -niE '\b(drop|rename)\b|alter column .* type' $files || (echo "::error::Las migraciones solo pueden sumar. Para borrar o renombrar, hablá con el profe." && exit 1)
      - name: Ninguna migración que ya está en main fue editada
        if: github.event_name == 'pull_request'
        run: |
          edited=$(git diff --name-only --diff-filter=DMR origin/${{ github.base_ref }} -- supabase/migrations)
          [ -z "$edited" ] || (echo "::error::No se editan migraciones ya mergeadas: $edited" && exit 1)
      - name: Las migraciones nuevas tienen fecha posterior a las de main
        if: github.event_name == 'pull_request'
        run: |
          ultima=$(git ls-tree --name-only origin/${{ github.base_ref }} supabase/migrations/ | xargs -n1 basename | sort | tail -1 | cut -d_ -f1)
          viejas=$(git diff --name-only --diff-filter=A origin/${{ github.base_ref }} -- supabase/migrations | xargs -rn1 basename | awk -F_ -v u="$ultima" '$1 <= u')
          [ -z "$viejas" ] || (echo "::error::Estas migraciones tienen fecha anterior a la última de main ($ultima). Renombralas con una fecha nueva (npm run db:nueva): $viejas" && exit 1)
      - name: Las migraciones nuevas no buscan personas por mail
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }} -- supabase/migrations | grep -v '_core_' || true)
          [ -z "$files" ] || ! grep -nE "personas.*email|->>\s*'email'" $files || (echo "::error::La columna personas.email no se puede leer. Para 'quién soy' usá mi_persona_id(); para mostrar mails, la vista personas_contacto." && exit 1)
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: placeholder

